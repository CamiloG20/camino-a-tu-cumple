<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <meta name="theme-color" content="#6a11cb" />
    <meta name="description" content="Cuenta regresiva con sorpresas diarias hasta tu cumpleaños" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tu cumple" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <title>Camino a tu cumple</title>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: auto;
        -webkit-overflow-scrolling: touch;
        background-color: #6a11cb;
      }
      #root {
        display: flex;
        min-height: 100%;
        flex: 1;
      }
    </style>
  </head>
  <body>
    <noscript>Necesitas habilitar JavaScript para usar esta aplicación.</noscript>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/sw.js')
            .then(function (registration) {
              console.log('Service Worker registrado:', registration.scope);
            })
            .catch(function (error) {
              console.warn('Service Worker no registrado:', error);
            });
        });
      }
    </script>
  </body>
</html>
